<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="God Mode — a personal command center for curious builders."
    />
    <title>God Mode — A personal command center</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" id="sideRail">
        <a class="wordmark" href="#home" data-route="home">
          <span class="wordmark-main">God Mode</span>
          <span class="wordmark-sub">A personal command center</span>
        </a>
        <div class="rail-rule"></div>
        <p class="nav-kicker">Navigate</p>
        <nav class="rail-nav" aria-label="Product areas">
          <a class="rail-link active" href="#home" data-route="home"
            ><span class="nav-icon">⌕</span>God Search</a
          >
          <a class="rail-link" href="#boards" data-route="boards"
            ><span class="nav-icon">▦</span>Dev Boards</a
          >
          <a class="rail-link" href="#github" data-route="github"
            ><span class="nav-icon">◌</span>GitHub</a
          >
          <a class="rail-link" href="#hackclub" data-route="hackclub"
            ><span class="nav-icon">✦</span>Hack Club <small>new</small></a
          >
          <a class="rail-link" href="#vehicles" data-route="vehicles"
            ><span class="nav-icon">▱</span>Vehicles</a
          >
          <a class="rail-link" href="#markets" data-route="markets"
            ><span class="nav-icon">↗</span>Markets</a
          >
          <a class="rail-link" href="#forge" data-route="forge"
            ><span class="nav-icon">✧</span>Project Forge</a
          >
        </nav>
        <div class="rail-foot">
          <strong>OM / 01</strong><br />Local-first workspace<br />No account
          required
        </div>
      </aside>

      <div class="main-stage">
        <header class="topline">
          <button
            class="mobile-menu"
            id="menuButton"
            aria-label="Open navigation"
          >
            ☰
          </button>
          <div class="breadcrumb">
            Workspace&nbsp; / &nbsp;<strong id="pageLabel">God Search</strong>
          </div>
          <div class="top-actions">
            <span class="status-dot">All systems quiet</span
            ><a
              href="#support"
              class="help-button"
              data-route="support"
              aria-label="Open support"
              >?</a
            >
          </div>
        </header>
        <main id="app"></main>
        <footer class="footer-note">
          Built for curiosity · live Wikipedia search · syncs every minute
        </footer>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
